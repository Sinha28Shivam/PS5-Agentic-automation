scenario: scenarios/game_menu/astro_playroom_launch.yaml
# Screen text the fake rig "shows". Built from phrases in config/screens/*.yaml so the
# real classifier judges it. Replace with real captured frames once recorded.
screens:
  home: "games media console storage online friends friend activity"
  tile: "games media console storage online friends friend activity ps5 astro's playroom"
  hub: "astro's playroom play game trophies friends who play"
  game: "astro's playroom press any button"
  keyboard: "search for games abc done"
  typed: "search for games astro abc done"
  results: "go to top switch tabs astro's playroom"
# Frame 0 = start screen; frame k = screen after action k.
cases:
  - name: pass
    frames: [home, home, home, home, home, home, home, tile, hub, game, home, home]
    steps: [focus_tile, open_hub, start, return_home]
    skip_actions: 6
    actions: ["macro:focus_tile:playroom", "press:down", "press:cross", "macro:home_from_game"]
  # Play Game that leaves the hub on screen must not be reported as a launch.
  - name: game_does_not_start
    frames: [home, home, home, home, home, home, home, tile, hub, hub, hub, home]
    verdict: FAIL
    step_verdicts: {start: FAIL}
