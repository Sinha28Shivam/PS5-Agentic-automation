# ============================================================================
#  controls.yaml - GLOBAL controller configuration
#  Single source of truth for every button, stick, trigger, timing and macro.
#  Used by test-controller and (later) the agentic test framework.
# ============================================================================
#
#  IMPORTANT - the `gimx` values below are NOT guesses. Every name was tested
#  against gimx.exe and only names it ACCEPTS are used here. Notably:
#     * "guide"  is REJECTED by GIMX -> the PS/Guide button is "PS"
#     * "LB/RB/LT/RT" are REJECTED   -> use l1/r1/l2/r2
#     * "lstick right/up" are REJECTED -> sticks are AXES: lstick x / lstick y
#     * "menu/view/back/share/options/touchpad/sync/home/xbox/gas/brake"
#       are all REJECTED -> Options = "start", Share/Create = "select"
#  GIMX internally uses PlayStation naming for EVERY pad, so this layer needed
#  no translation when this rig moved from Xbox One to PS5: "cross", "circle",
#  "l1", "PS" were already the wire names. Only the CANONICAL names and
#  aliases changed to stop callers thinking in Xbox terms.
#
#  Value semantics:
#     buttons : 1 = pressed, 0 = released
#     triggers: 0..32767 analog (l2/r2). 32767 = fully pressed.
#               HARDWARE-VERIFIED: on XOnePad the trigger axis uses the SAME
#               wide range as the sticks, NOT 0..255. r2(255) is only ~0.8% of
#               a full pull - gimx.exe ACCEPTS it, but the console sees an
#               almost-unpressed trigger and games ignore it. Measured on Max:
#               The Curse of Brotherhood, watching the RT tutorial prompt:
#                 r2(255)/r2(512) -> prompt ROI delta 0.2-0.3  (no effect)
#                 r2(1023)        -> delta 65.9  (magic marker OPENS)
#                 r2(32767)       -> delta 66.3  (magic marker OPENS)
#               Activation threshold sits between 512 and 1023.
#     sticks  : XOnePad axes use -32768..32767. 0 = centered
# ============================================================================

meta:
  version: 1
  description: "Global control map and timing profile for console automation"
  verified_against: "GIMX 8.0 / EMUPS4 firmware / DS4"

# ---------------------------------------------------------------------------
# CONSOLE PROFILES
# Adding a new console = add a profile here + flash matching firmware with
#   flash_leonardo.ps1 -Firmware <FIRMWARE>
# ---------------------------------------------------------------------------
#
#  AUTHENTICATION DIFFERS PER FAMILY - this is not a detail:
#     Xbox One : a genuine MS pad passes auth through AND a human must HOLD
#                THE GUIDE BUTTON FOR 2 SECONDS.
#     PS4/PS5  : a genuine DualShock 4 passes auth through, and GIMX DOES
#                still print "Press the key/button assigned to PS." at
#                startup - OBSERVED on this rig 2026-10-30. So a human button
#                press IS required to arm the session, same as Xbox. What
#                differs is only WHICH button and that it is a TAP of PS
#                rather than a 2-second hold of Guide.
#                (An earlier revision of this file claimed no gesture was
#                needed on PlayStation. That was WRONG - GIMX asks for PS.)
# ---------------------------------------------------------------------------
consoles:
  # ---- PlayStation 5 ------------------------------------------------------
  # GIMX CANNOT emulate a DualSense. The only path to a PS5 is to present a
  # DualShock 4, which the PS5 accepts for BACKWARD-COMPATIBLE PS4 TITLES ONLY.
  # PS5-native games reject it: they require the DualSense.
  #
  #   * auth device  : a genuine DualShock 4 wired to the PC (NOT an Xbox pad).
  #   * known limit  : auth can drop after ~8 minutes with some original DS4
  #                    units, which kills long runs mid-scenario.
  #   * HDCP         : the PS5 encrypts its system UI over HDMI. The capture
  #                    card then returns BLANK frames and every blank-check in
  #                    this repo will honestly report "no signal" while the
  #                    rig is perfectly fine. Disable
  #                    Settings > System > HDMI > Enable HDCP.
  #
  # HARDWARE-VERIFIED 2026-10-30 (adapter + auth only; input not yet proven):
  #   GIMX adapter detected, controller type is: DS4.
  #   Firmware version: 8.0
  #   Using baudrate: 2000000 bps.
  #   found pass-through device 0x054c:0x09cc
  #   registered joystick 0 with name "PS4 Controller"
  ps5:
    gimx_type: "DS4"              # --type value (DualSense is NOT supported)
    firmware: "EMUPS4"            # .hex used by flash_leonardo.ps1
    config_file: "Dualshock4.xml" # %APPDATA%\gimx\config\Dualshock4.xml
    auth_device: "dualshock4"     # what has to be plugged into the PC
    # GIMX prompts "Press the key/button assigned to PS." - a TAP on the real
    # DS4, not a 2-second hold. Until that press happens the session accepts
    # every event and delivers none, exactly like an unauthenticated Xbox one.
    auth_gesture: "tap_ps"
    notes: "PS4-compatible titles only. DualSense/PS5-native titles reject DS4."
    default: true

  ps4:
    gimx_type: "DS4"
    firmware: "EMUPS4"
    config_file: "Dualshock4.xml"
    auth_device: "dualshock4"
    auth_gesture: "tap_ps"
    default: false

  ps3:
    gimx_type: "Sixaxis"
    firmware: "EMUPS3"
    config_file: null
    auth_device: null
    auth_gesture: null
    default: false

# ---------------------------------------------------------------------------
#  *** config_file IS NOT OPTIONAL ***
#  Without --config, GIMX starts, prints "adapter detected", accepts every
#  event and forwards NOTHING - not even a physical controller. That failure
#  is completely silent and is the single most expensive mistake in this
#  project's history.
#
#  The ps5/ps4 profiles above therefore CANNOT SEND INPUT YET. Create a DS4
#  launcher config in the GIMX GUI, save it (it lands in the GIMX config dir),
#  and put its filename in config_file. Until then gimx_session.py will refuse
#  to start these profiles rather than bring up a silently-dead session.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CONNECTION
# ---------------------------------------------------------------------------
connection:
  gimx_exe: "C:\\Program Files\\GIMX\\gimx.exe"
  serial_port: "COM8"             # FTDI UART -> Leonardo
  udp_address: "127.0.0.1"
  udp_port: 51914
  # Safety flags for any GIMX session we launch ourselves.
  # An elevated GIMX once took REALTIME priority and grabbed input, freezing
  # the whole PC. These prevent a repeat.
  safety:
    nograb: true                  # never capture mouse/keyboard
    idle_timeout_minutes: 30      # auto-exit if idle
    force_normal_priority: true   # never let it starve the OS

# ---------------------------------------------------------------------------
# CAPTURE (video input for the perception / verification layer)
#
# HARDWARE-VERIFIED: a 1920x1080 frame of the real PS5 home screen was
# captured 2026-10-30 (docs/reference/ps5-home-1080p.png).
#
#   * The card is a STANDARD UVC device - no vendor SDK needed.
#   * RECentral 4 is NOT required and must be CLOSED while automating:
#     only one application can open a capture device at a time. RECentral
#     holding it produced "Could not run graph (device already in use)".
#   * Indices SHIFT. They are positional, and plugging in a USB camera or
#     docking the laptop reorders them.
#
#     CONFIRMED 2026-08-14: the indices swapped. The card moved to 0 and the
#     HP HD Camera took 1. The framework dutifully read the webcam - 1280x720,
#     std 1.5 - and reported "black screen / no HDMI signal" while the Xbox was
#     sitting on index 0 at 1920x1080, std 35.8.
#
#     That is a nasty failure: a webcam in a dim room is a *plausible* capture
#     device. It opens, it returns frames, and those frames are dark, so every
#     naive check agrees the console must be off.
#
#     Fix: capture.py now resolves the device BY NAME via ffmpeg and only falls
#     back to opencv_index if the name cannot be found. Run
#     `python capture\capture.py preflight` to see which device was opened.
# ---------------------------------------------------------------------------
capture:
  device_name: "AVerMedia ExtremeCap UVC"   # ffmpeg dshow name (stable)
  usb_id: "VID_07CA&PID_0110"

  # Match device_name against the ffmpeg device list at open() time. Keep this
  # true: the name is stable, the index is not. Set false only to force the
  # literal opencv_index below (useful when two identical cards are attached).
  auto_detect_device: true

  # Fallback only, used when the name cannot be matched. Was 1; the card is
  # currently enumerating at 0. Do not rely on this value - it moves.
  opencv_index: 0
  width: 1920
  height: 1080
  fps: 30                         # card supports up to 60
  fourcc: "MJPG"
  backend: "opencv"               # 'opencv' (fast) or 'ffmpeg' (robust)

  # Measured on this machine, 2026-08-12:
  #   OpenCV : ~726 ms first frame (device open), then ~1 ms per frame
  #   ffmpeg : ~0.7 s per grab (new process each time)
  # => keep ONE OpenCV handle open for the agent loop; use ffmpeg for one-offs.
  # SYNC BEHAVIOUR (measured) - important, and easy to misdiagnose.
  # After the device is opened, the first ~2 reads come back PERFECTLY FLAT
  # (std 0.00) while the card locks onto the HDMI signal. Real content arrives
  # at ~1.05 s. Grabbing immediately therefore looks EXACTLY like "no HDMI
  # signal" even though the console is on and everything is fine.
  # capture.py polls until a non-blank frame appears rather than trusting a
  # fixed frame count.
  warmup_frames: 3                # reads discarded outright
  sync_timeout: 5.0               # then poll this long for real content

  # Blank-frame detection. A flat image means no signal / HDCP / wrong input.
  # Real console content measured std ~49 with 255 tones; a blank frame was
  # std 0.0 with 1 tone, so this threshold has a wide margin.
  blank_std_threshold: 1.0

  conflicting_apps: ["RECentral 4", "OBS", "Teams", "Camera", "Zoom"]

# ---------------------------------------------------------------------------
# BUTTONS  (digital: 1 = press, 0 = release)
#   name -> gimx control name + friendly aliases
# ---------------------------------------------------------------------------
#
#  NAMING: canonical names are now PlayStation names. The Xbox names are kept
#  as ALIASES so every existing scenario, route and test that says "a" or
#  "guide" keeps working - they resolve to cross / PS exactly as before.
#  New work should prefer the PlayStation names.
#
#  PS5 FACE-BUTTON WARNING: on PlayStation, CROSS confirms and CIRCLE cancels
#  in most regions - the same positions as Xbox A/B - so "a"->cross and
#  "b"->circle stay semantically correct. But Japanese-region systems and some
#  titles SWAP them (circle confirms). If confirms start cancelling, this is
#  the first place to look.
# ---------------------------------------------------------------------------
buttons:
  # ---- Face buttons -------------------------------------------------------
  cross:
    gimx: "cross"
    aliases: ["a", "confirm", "select_item"]
    description: "Cross - confirm/select. VERIFIED PS5 2026-10-30 (opens search, types focused key)"
    verified: true
  circle:
    gimx: "circle"
    aliases: ["b", "cancel", "back_action"]
    description: "Circle - back/cancel. VERIFIED PS5 (closes menus, keyboard, search -> Home)"
    verified: true
  square:
    gimx: "square"
    aliases: ["x"]
    description: "Square. On the PS5 keyboard = backspace (VERIFIED). No visible action on Home."
    verified: true
  triangle:
    gimx: "triangle"
    aliases: ["y"]
    description: "Triangle. Home: jumps focus to the Search icon (VERIFIED). Keyboard: space (VERIFIED)."
    verified: true

  # ---- D-pad --------------------------------------------------------------
  up:
    gimx: "up"
    aliases: ["u", "dpad_up"]
    description: "D-pad up. VERIFIED PS5 2026-10-30"
    verified: true
  down:
    gimx: "down"
    aliases: ["d", "dpad_down"]
    description: "D-pad down. VERIFIED PS5 2026-10-30"
    verified: true
  left:
    gimx: "left"
    aliases: ["l", "dpad_left"]
    description: "D-pad left. VERIFIED PS5 2026-10-30"
    verified: true
  right:
    gimx: "right"
    aliases: ["r", "dpad_right"]
    description: "D-pad right. VERIFIED PS5 2026-10-30"
    verified: true

  # ---- System buttons -----------------------------------------------------
  options:
    gimx: "start"
    aliases: ["menu", "start", "hamburger", "pause"]
    description: "Options - GIMX 'start'. VERIFIED PS5: opens the item's options menu"
    verified: true
  share:
    gimx: "select"
    aliases: ["view", "select", "back", "create", "windows"]
    description: >
      Share button (DS4) / Create (DualSense) - GIMX calls it 'select'.
      NOT yet verified on PS5 (opens the Create menu / screenshot).
  ps:
    gimx: "PS"
    aliases: ["guide", "xbox", "home", "playstation", "dashboard"]
    description: >
      PS (PlayStation logo) button. GIMX name is 'PS' ('guide' is REJECTED).
      VERIFIED PS5: a tap opens the Control Center (Circle closes it).
      The session-arming PS tap must come from the HUMAN on the wired DS4,
      not from GIMX.
    verified: true

  # ---- Shoulder buttons ---------------------------------------------------
  l1:
    gimx: "l1"
    aliases: ["lb", "left_bumper"]
    description: "L1. VERIFIED PS5: Home Media -> Games tab. Keyboard: cursor left"
    verified: true
  r1:
    gimx: "r1"
    aliases: ["rb", "right_bumper"]
    description: "R1. VERIFIED PS5: Home Games -> Media tab. Keyboard: cursor right / 1st suggestion"
    verified: true

  # ---- Stick clicks -------------------------------------------------------
  l3:
    gimx: "l3"
    aliases: ["ls", "left_stick_click", "lsb"]
    description: "Left stick press (click)"
  r3:
    gimx: "r3"
    aliases: ["rs", "right_stick_click", "rsb"]
    description: "Right stick press (click). PS5 keyboard: accented-letters page (VERIFIED)"

# ---------------------------------------------------------------------------
# TRIGGERS  (analog 0..255)
# ---------------------------------------------------------------------------
triggers:
  l2:
    gimx: "l2"
    aliases: ["lt", "left_trigger"]
    min: 0
    max: 32767
    default_press: 32767          # value used for a normal "press"
    description: "L2 trigger (analog). PS5 keyboard: shift (VERIFIED)"
  r2:
    gimx: "r2"
    aliases: ["rt", "right_trigger"]
    min: 0
    max: 32767
    default_press: 32767
    description: "R2 trigger (analog). PS5 keyboard: Done - closes it, focuses 1st result (VERIFIED)"

# ---------------------------------------------------------------------------
# STICKS (analog axes)
#   GIMX exposes sticks as AXES, not directions. Directional names like
#   "lstick right" are REJECTED, so directions are expressed as axis+value.
# ---------------------------------------------------------------------------
sticks:
  left_stick:
    x_axis: "lstick x"
    y_axis: "lstick y"
    min: -32768
    max: 32767
    center: 0
    deadzone: 10
    directions:                   # convenience: name -> (axis, value)
      left:  { axis: "lstick x", value: -32768 }
      right: { axis: "lstick x", value: 32767 }
      up:    { axis: "lstick y", value: -32768 }
      down:  { axis: "lstick y", value: 32767 }
    description: "Left analog stick - movement"

  right_stick:
    x_axis: "rstick x"
    y_axis: "rstick y"
    min: -32768
    max: 32767
    center: 0
    deadzone: 10
    directions:
      left:  { axis: "rstick x", value: -32768 }
      right: { axis: "rstick x", value: 32767 }
      up:    { axis: "rstick y", value: -32768 }
      down:  { axis: "rstick y", value: 32767 }
    description: "Right analog stick - camera/look"

# ---------------------------------------------------------------------------
# TIMING  (all values in SECONDS)
# Tune these centrally instead of hunting for sleeps in code.
# ---------------------------------------------------------------------------
timing:
  tap_duration: 0.08              # normal quick press
  press_duration: 0.15            # standard press
  long_press_duration: 1.0        # "deep"/long press
  deep_press_duration: 2.0        # e.g. guide button power menu
  gap_between_presses: 0.25       # pause after each press
  gap_between_sequences: 0.5      # pause between macro steps

  menu_transition_wait: 1.0       # let a menu animate in
  screen_load_wait: 3.0           # page/blade change
  game_launch_wait: 30.0          # cold game start (varies wildly by title)
  console_boot_wait: 60.0

  session_settle: 4.0             # after starting GIMX before first event
  udp_retry_delay: 1.5
  udp_max_retries: 6

# ---------------------------------------------------------------------------
# TEXT ENTRY - PS5 system on-screen keyboard
#
# HARDWARE-VERIFIED 2026-10-30 on the PS5 global search (Home > Search icon >
# Cross on the field). Reference frames: docs/reference/ps5-keyboard-*.png.
# Typing "ps5" by pure grid navigation from the initial focus produced "Ps5".
#
# Geometry (1920x1080):
#   * 4 character rows x 11 columns, column pitch ~75 px starting x=323,
#     row y = 288 / 352 / 416 / 480.
#   * Initial focus when the keyboard opens: "g" (row 2, col 4).
#   * LEFT/RIGHT WRAP within a row (6x left from "4" landed on "9").
#   * Below row 3 is the control strip (shift/ABC/@#:/a-grave/space/backspace,
#     then cursor arrows / ... / Done). Do not navigate into it - every
#     control has a face/shoulder shortcut, listed in `shortcuts`.
#   * UP from row 0 leaves the keyboard into the search results (it does NOT
#     wrap to the bottom). Never navigate up off row 0.
#   * The FIRST letter of the field is auto-capitalised ("ps5" -> "Ps5").
#     PS5 search is case-insensitive, so verify text case-insensitively.
#   * A suggestion strip appears above row 0 after typing (R1 picks the first).
# ---------------------------------------------------------------------------
text_entry:
  defaults:
    keyboard_variant: "ps5_system_en"
    verify_chunk_size: 2
    max_retries: 2
    reanchor_each_char: false
    move_interval: 0.3
    key_pause: 0.4
    recovery_pause: 0.5
    case_sensitive_verify: false

  keyboard_layouts:
    ps5_system_en:
      description: "PS5 system keyboard (English), as opened from global search"
      verified: true
      open_from_search_field: "cross"     # Cross on the focused search field
      initial_focus: "g"
      # Auto-caps: an empty field opens on abc_shift (verified frame k02) and
      # drops to abc after the first character. Same cell positions, so
      # navigation is identical; only "'"/"," "." differ (see abc_shift).
      initial_page: "abc_shift"
      wrap_horizontal: true
      wrap_vertical: false
      cell_px: { x0: 323, dx: 74.6, rows_y: [288, 352, 416, 480] }
      search_box_region:                  # fractions of the frame
        x: 0.135
        y: 0.105
        width: 0.775
        height: 0.07
      typed_text_region:
        x: 0.165
        y: 0.11
        width: 0.40
        height: 0.06
      keyboard_region:
        x: 0.135
        y: 0.17
        width: 0.455
        height: 0.415
      pages:
        abc:
          rows:
            - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "@"]
            - ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p", "#"]
            - ["a", "s", "d", "f", "g", "h", "j", "k", "l", "'", "/"]
            - ["z", "x", "c", "v", "b", "n", "m", ",", ".", "?", "!"]
        # Shown while shift (L2) is active. Row 2 col 9 and row 3 cols 7-8
        # differ from lower case, not just in case.
        abc_shift:
          rows:
            - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "@"]
            - ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "#"]
            - ["A", "S", "D", "F", "G", "H", "J", "K", "L", "\"", "/"]
            - ["Z", "X", "C", "V", "B", "N", "M", "-", "_", "?", "!"]
        # "@#:" page. Columns 10-11 were partly off-screen/faint in the
        # reference frame; "" marks cells not confidently read.
        symbols:
          rows:
            - ["!", "?", "\"", "'", "#", "%", "(", ")", "()", "/", "\u201c", ""]
            - ["-", "_", ",", ".", ":", ";", "*", "&", "+", "=", "\u00d7", "\u00f7"]
            - ["<", ">", "@", "[", "]", "[]", "{", "}", "{}", "\u00a7", "\u00a6", "\u00b5"]
            - ["\\", "|", "^", "`", "$", "\u20ac", "\u00a3", "\u00a5", "\u20a9", "\u00a2", "\u00a4", ""]
          verified: partial
        # R3 page (accented letters). Not needed for search; listed for
        # completeness so an agent never mistakes it for a broken keyboard.
        accents:
          rows:
            - ["\u00e0", "\u00e1", "\u00e2", "\u00e3", "\u00e4", "\u00e5", "\u0105", "\u00e6", "\u00e7", "\u0107"]
            - ["\u00e8", "\u00e9", "\u00ea", "\u00eb", "\u0119", "\u011f", "\u00ec", "\u00ed", "\u00ee", "\u00ef"]
            - ["\u0131", "\u0142", "\u00f1", "\u0144", "\u00f2", "\u00f3", "\u00f4", "\u00f5", "\u00f6", "\u00f8"]
            - ["\u0153", "\u015b", "\u015f", "\u0161", "\u00df", "\u00f9", "\u00fa", "\u00fb", "\u00fc", "\u00fd"]
            - ["\u00ff", "\u017a", "\u017c", "\u017e", "\u00f0", "\u00fe"]
          verified: partial
      # Controller shortcuts printed on the keyboard itself, each one tested.
      shortcuts:
        type_focused: "cross"
        space: "triangle"            # VERIFIED: "Ps" -> "Ps "
        backspace: "square"          # VERIFIED: "Ps5" -> "Ps"
        shift: "l2"                  # VERIFIED: toggles abc <-> abc_shift
        accents_page: "r3"           # VERIFIED: switches to `accents`
        cursor_left: "l1"            # printed on key; not separately tested
        cursor_right: "r1"           # printed on key; R1 also picks the first suggestion
        more: "options"              # "..." menu
        done: "r2"                   # printed on key; closes keyboard, keeps text
        close_keyboard: "circle"     # VERIFIED: closes keyboard, keeps text, shows results
      special_keys:
        space: "space"
        backspace: "backspace"
        done: "done"
      # Entering the symbols page needs navigation into the control strip:
      # from any row-3 cell press DOWN (lands on the strip), then move to
      # "@#:" and Cross. Return with the same path to "ABC".
      symbols_page_via_strip: true

# ---------------------------------------------------------------------------
# SPECIAL / COMPOUND ACTIONS
# Multi-step or timing-dependent operations.
# ---------------------------------------------------------------------------
special_actions:
  screenshot:
    description: "PS5 screenshot: tap Create/Share"
    sequence:
      - { button: "share", duration: 0.1 }
    verified: false               # NOT yet confirmed on hardware

  record_clip:
    description: "PS5 recent-gameplay clip: hold Create/Share, then confirm"
    sequence:
      - { button: "share", duration: 1.0 }
      - { wait: 1.0 }
      - { button: "square", duration: 0.1 }
    verified: false

  control_center:
    description: "Open the PS5 Control Center (tap PS)"
    sequence:
      - { button: "ps", duration: 0.1 }
    verified: true

  power_menu:
    description: "Hold PS to open the power/quick menu"
    sequence:
      - { button: "ps", duration: 2.0 }
    verified: false

  # NOTE: there is deliberately NO auth macro here. The PS tap that arms a
  # GIMX session must come from the HUMAN on the DS4 wired to the PC. Sending
  # PS through GIMX only opens the Control Center, which then swallows the
  # next presses and looks exactly like a navigation bug.

# ---------------------------------------------------------------------------
# MACROS - reusable navigation sequences
#
# Step keys:
#   button   : name from `buttons` (or an alias)
#   times    : repeat the button N times     (e.g. move down 3 rows)
#   interval : extra pause BETWEEN repeats, seconds. Animated menus can drop
#              presses that arrive too fast - raise this if steps get eaten.
#   duration : how long the button is held for each press
#   wait     : pause, seconds (used on its own)
#   trigger / value, stick / direction|x|y are also supported
#   strength : 0.0..1.0 stick deflection for named stick directions
#
# Example:  - { button: down, times: 3, interval: 0.4 }
# Example:  - { stick: left_stick, direction: left, duration: 0.5, strength: 0.2 }
# ---------------------------------------------------------------------------
macros:
  confirm:
    description: "Confirm current selection"
    steps:
      - { button: "cross" }

  go_back:
    description: "Back out one level"
    steps:
      - { button: "circle" }

  open_home:
    description: >
      Back out to the PS5 home screen with Circle. VERIFIED from the options
      menu, the Control Center and global search (search needs 2-3 presses).
      Extra presses on Home are harmless.
    steps:
      - { button: "circle", times: 3, interval: 0.8 }

  open_search:
    description: >
      From Home: Triangle jumps to the Search icon, Cross opens search, Cross
      on the focused field opens the keyboard (focus on "g", shift on).
      VERIFIED 2026-10-30.
    steps:
      - { button: "triangle" }
      - { wait: 0.8 }
      - { button: "cross" }
      - { wait: 2.0 }
      - { button: "cross" }
      - { wait: 1.5 }

  submit_search:
